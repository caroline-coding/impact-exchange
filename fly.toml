app = "impact-exchange"
primary_region = "sjc"

[env]
  DB_PATH = "/data/exchange.db"
  PORT = "3000"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
